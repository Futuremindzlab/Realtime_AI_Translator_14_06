name: Deploy Backend (Lambda + API Gateway)

on:
  # Gated on the Tests workflow finishing successfully on master, rather than
  # on push directly — pushing straight to master used to kick off this
  # deploy and the "Tests" workflow's own re-run on master in parallel, with
  # nothing stopping a red backend test from still deploying to prod. The
  # PR's required `test.yml` check (pull_request trigger) already blocked
  # the merge itself from happening on red CI, but this closes the matching
  # gap on master's *own* re-run of those tests post-merge — e.g. a test
  # that's order- or environment-dependent and only fails outside the PR's
  # context, or a direct push bypassing PR review entirely.
  workflow_run:
    workflows: ['Tests']
    types: [completed]
    branches: [master]
  workflow_dispatch:
    inputs:
      stage:
        description: 'Deployment stage'
        required: true
        default: 'prod'
        type: choice
        options: [prod, dev, staging]

env:
  AWS_REGION: ${{ secrets.EXPO_PUBLIC_AWS_REGION }}
  STAGE:      ${{ github.event.inputs.stage || 'prod' }}

jobs:
  deploy-backend:
    name: SAM Build & Deploy
    runs-on: ubuntu-latest
    # workflow_dispatch always runs (manual, deliberate). workflow_run only
    # deploys when ALL of: the Tests run it's reacting to actually passed (a
    # failure or cancellation must NOT deploy); it was Tests' push-triggered
    # run, not a pull_request run — workflow_run's `branches` filter above
    # matches on a PR's *base* branch, not its head, so without this check
    # every PR opened against master would also match `branches: [master]`
    # and attempt a prod deploy on green PR CI, before anything merges; and
    # it actually ran on master (belt-and-suspenders with the filter above).
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'master')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # workflow_run checks out master's default ref unless told
          # otherwise — pin to the exact commit the Tests run covered, so a
          # fast-forwarding master between that run and this one can't
          # deploy code the tests never actually ran against.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          # Need the previous commit too, to diff for the path filter below
          # (workflow_run carries no `paths` filter of its own, unlike the
          # old push trigger — only a push event supports that).
          fetch-depth: 2

      - name: Check whether backend/** changed
        if: github.event_name == 'workflow_run'
        id: changes
        run: |
          if git diff --quiet HEAD~1 HEAD -- backend/ .github/workflows/deploy-backend.yml; then
            echo "backend_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "backend_changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS credentials
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.backend_changed != 'false'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.EXPO_PUBLIC_AWS_REGION }}

      - name: Set up SAM CLI
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.backend_changed != 'false'
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Install Lambda dependencies
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.backend_changed != 'false'
        working-directory: backend
        run: npm install --omit=dev

      - name: SAM Build
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.backend_changed != 'false'
        working-directory: backend
        run: sam build --use-container

      - name: SAM Deploy
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.backend_changed != 'false'
        working-directory: backend
        env:
          USER_POOL_ID:            ${{ secrets.EXPO_PUBLIC_AWS_USER_POOL_ID }}
          USER_POOL_CLIENT_ID:     ${{ secrets.EXPO_PUBLIC_AWS_USER_POOL_CLIENT_ID }}
          OPENAI_API_KEY:          ${{ secrets.OPENAI_API_KEY }}
          ELEVENLABS_API_KEY:      ${{ secrets.ELEVENLABS_API_KEY }}
          AZURE_SPEECH_KEY:        ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION:     ${{ secrets.AZURE_SPEECH_REGION }}
          RAZORPAY_KEY_ID:         ${{ secrets.RAZORPAY_KEY_ID }}
          RAZORPAY_KEY_SECRET:     ${{ secrets.RAZORPAY_KEY_SECRET }}
          RAZORPAY_WEBHOOK_SECRET: ${{ secrets.RAZORPAY_WEBHOOK_SECRET }}
          RAZORPAY_PLAN_ID_PLUS:   ${{ secrets.RAZORPAY_PLAN_ID_PLUS }}
          RAZORPAY_PLAN_ID_LIVE:   ${{ secrets.RAZORPAY_PLAN_ID_LIVE }}
          CORS_ALLOWED_ORIGINS:    ${{ secrets.CORS_ALLOWED_ORIGINS }}
        run: |
          # `sam deploy --parameter-overrides` rejects a bare `Key=` with an
          # empty value ("... is not a valid format") — but several of these
          # are intentionally optional in template.yaml (Default: "", meaning
          # "leave blank to disable this feature": ElevenLabs, Azure TTS, and
          # all 5 Razorpay params). Rather than fail the whole deploy whenever
          # one of those happens to be unset, only add an override when the
          # secret actually has a value; an omitted one falls through to the
          # template's own "" default — exactly the "not configured" state
          # the app code already checks for (e.g. billing.mjs's `if (!planId)`).
          PARAMS=(
            "Stage=${STAGE}"
            "UserPoolId=${USER_POOL_ID}"
            "UserPoolClientId=${USER_POOL_CLIENT_ID}"
            "TranslationsTable=conversation_history"
            "SettingsTable=user_settings"
            "OpenAIApiKey=${OPENAI_API_KEY}"
          )
          [ -n "$ELEVENLABS_API_KEY" ]      && PARAMS+=("ElevenLabsApiKey=${ELEVENLABS_API_KEY}")
          [ -n "$AZURE_SPEECH_KEY" ]        && PARAMS+=("AzureSpeechKey=${AZURE_SPEECH_KEY}")
          [ -n "$AZURE_SPEECH_REGION" ]     && PARAMS+=("AzureSpeechRegion=${AZURE_SPEECH_REGION}")
          [ -n "$RAZORPAY_KEY_ID" ]         && PARAMS+=("RazorpayKeyId=${RAZORPAY_KEY_ID}")
          [ -n "$RAZORPAY_KEY_SECRET" ]     && PARAMS+=("RazorpayKeySecret=${RAZORPAY_KEY_SECRET}")
          [ -n "$RAZORPAY_WEBHOOK_SECRET" ] && PARAMS+=("RazorpayWebhookSecret=${RAZORPAY_WEBHOOK_SECRET}")
          [ -n "$RAZORPAY_PLAN_ID_PLUS" ]   && PARAMS+=("RazorpayPlanIdPlus=${RAZORPAY_PLAN_ID_PLUS}")
          [ -n "$RAZORPAY_PLAN_ID_LIVE" ]   && PARAMS+=("RazorpayPlanIdLive=${RAZORPAY_PLAN_ID_LIVE}")
          [ -n "$CORS_ALLOWED_ORIGINS" ]    && PARAMS+=("CorsAllowedOrigins=${CORS_ALLOWED_ORIGINS}")

          sam deploy \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --stack-name   ai-translator-stack \
            --resolve-s3 \
            --s3-prefix    ai-translator-stack \
            --region       "${AWS_REGION}" \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM CAPABILITY_AUTO_EXPAND \
            --parameter-overrides "${PARAMS[@]}"

      - name: Print API base URL
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.backend_changed != 'false'
        run: |
          echo "✅ Backend deployed!"
          aws cloudformation describe-stacks \
            --stack-name ai-translator-stack \
            --query "Stacks[0].Outputs[?OutputKey=='ApiBaseUrl'].OutputValue" \
            --output text
