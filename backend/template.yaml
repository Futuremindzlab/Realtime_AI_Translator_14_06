AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Realtime AI Translator — API Gateway + Lambda backend

# ──────────────────────────────────────────────────────────
# Parameters — override via `sam deploy --parameter-overrides`
# ──────────────────────────────────────────────────────────
Parameters:
  Stage:
    Type: String
    Default: prod
    AllowedValues: [prod, dev, staging]

  UserPoolId:
    Type: String
    Description: Cognito User Pool ID for JWT authorizer

  UserPoolClientId:
    Type: String
    Description: Cognito User Pool Client ID

  TranslationsTable:
    Type: String
    Default: conversation_history

  SettingsTable:
    Type: String
    Default: user_settings

  UsageTable:
    Type: String
    Default: ai_usage
    Description: Per-user, per-day AI-proxy call counters (see lib/usageLimits.mjs) — disposable, TTL-expired after ~2 days, not a source of truth for anything.

  # ── AI provider keys — held server-side only; never shipped to the client.
  # Pass via `sam deploy --parameter-overrides` (or samconfig.toml), not source control.
  OpenAIApiKey:
    Type: String
    NoEcho: true
    Description: OpenAI API key — powers translation, TTS and Whisper transcription proxy routes

  ElevenLabsApiKey:
    Type: String
    NoEcho: true
    Default: ""
    Description: ElevenLabs API key — optional; leave blank to disable the ElevenLabs TTS proxy

  AzureSpeechKey:
    Type: String
    NoEcho: true
    Default: ""
    Description: Azure Speech key — optional; leave blank to disable the Azure TTS proxy

  AzureSpeechRegion:
    Type: String
    Default: ""
    Description: Azure Speech region (e.g. eastus) — required only if AzureSpeechKey is set

  AudioRetentionDays:
    Type: Number
    Default: 90
    Description: Days to retain stored translation audio (source + TTS) in S3 before automatic expiration

  # ── India DLT (TRAI) SMS registration — see DOCUMENTATION.md's "Phone + OTP
  # login" section. All three optional; leave blank until AWS has confirmed
  # your DLT Entity ID + Template ID via an AWS Support case — createAuthChallenge.mjs
  # only attaches these to outbound SMS when set, so leaving them unset changes
  # nothing for non-Indian numbers or before registration is complete.
  SnsDltEntityId:
    Type: String
    Default: ""
    Description: TRAI DLT Principal Entity ID, confirmed by AWS Support — optional, required for reliable OTP delivery to +91 numbers

  SnsDltTemplateId:
    Type: String
    Default: ""
    Description: TRAI DLT Template ID for the OTP message (must match createAuthChallenge.mjs's buildOtpMessage() text exactly) — optional, required for reliable OTP delivery to +91 numbers

  SnsSenderId:
    Type: String
    Default: ""
    Description: Registered DLT header/Sender ID (e.g. ONELNG) — optional, required for reliable OTP delivery to +91 numbers

  # ── Razorpay recurring subscriptions — see backend/scripts/setup-razorpay-plans.mjs
  # and RAZORPAY_INTEGRATION.md. Key/secret/webhook-secret are held server-side
  # only, same treatment as the AI provider keys above.
  RazorpayKeyId:
    Type: String
    Default: ""
    Description: Razorpay Key ID (rzp_test_... or rzp_live_...) — public, but still passed as a parameter to keep all Razorpay config in one place. Leave blank to disable billing routes.

  RazorpayKeySecret:
    Type: String
    NoEcho: true
    Default: ""
    Description: Razorpay Key Secret — used to create subscriptions and verify post-checkout payment signatures. Never sent to the client.

  RazorpayWebhookSecret:
    Type: String
    NoEcho: true
    Default: ""
    Description: Webhook secret configured in the Razorpay Dashboard for the /v1/billing/razorpay/webhook endpoint — distinct from RazorpayKeySecret.

  RazorpayPlanIdPlus:
    Type: String
    Default: ""
    Description: Razorpay Plan ID for the 'plus' tier (₹200/month) — created once via scripts/setup-razorpay-plans.mjs, immutable afterward.

  RazorpayPlanIdLive:
    Type: String
    Default: ""
    Description: Razorpay Plan ID for the 'live' tier (₹360/month) — created once via scripts/setup-razorpay-plans.mjs, immutable afterward.

  # ── Cost monitoring — see the EstimatedChargesAlarm resource below for the
  # two manual, one-time account-level prerequisites CloudFormation cannot
  # set for you (billing alerts must be enabled, and this stack must deploy
  # to us-east-1).
  BillingAlarmEmail:
    Type: String
    Default: ""
    Description: Email to notify when estimated AWS charges exceed BillingAlarmThresholdUSD. Leave blank to create the alarm with no destination (add a subscription manually later). AWS emails a confirmation link to this address after deploy — the alarm stays silent until it's clicked.

  BillingAlarmThresholdUSD:
    Type: Number
    Default: 25
    Description: Placeholder threshold (USD) for the estimated-charges billing alarm — tune based on your actual expected spend once you have real usage data.

# ──────────────────────────────────────────────────────────
# Globals — applied to every Lambda function
# ──────────────────────────────────────────────────────────
Globals:
  Function:
    Runtime:      nodejs20.x
    Handler:      src/index.handler
    Architectures: [x86_64]
    MemorySize:   512
    Timeout:      30
    Environment:
      Variables:
        TRANSLATIONS_TABLE: !Ref TranslationsTable
        SETTINGS_TABLE:     !Ref SettingsTable
        NODE_OPTIONS:       "--enable-source-maps"

# ──────────────────────────────────────────────────────────
# Conditions
# ──────────────────────────────────────────────────────────
Conditions:
  HasBillingAlarmEmail: !Not [!Equals [!Ref BillingAlarmEmail, ""]]

# ──────────────────────────────────────────────────────────
# Resources
# ──────────────────────────────────────────────────────────
Resources:

  # ── REST API ────────────────────────────────────────────
  TranslatorApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub "ai-translator-api-${Stage}"
      StageName: !Ref Stage
      Cors:
        AllowMethods: "'GET,POST,PUT,PATCH,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowOrigin:  "'*'"
      Auth:
        DefaultAuthorizer: CognitoJwtAuthorizer
        AddDefaultAuthorizerToCorsPreflight: false
        Authorizers:
          CognitoJwtAuthorizer:
            UserPoolArn: !Sub "arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${UserPoolId}"
            Identity:
              Header: Authorization
      # Stage-level throttling — nothing here before, so a single leaked
      # token (or a bug looping requests) had no ceiling beyond the account's
      # very high default API Gateway limits (10,000 burst / 5,000 rps).
      # Placeholder numbers — tune against real traffic once you have it.
      # The two truly public, unauthenticated POST routes (phone-otp request,
      # Razorpay webhook) get their own tighter overrides below, since they
      # need no Cognito token to reach at all.
      MethodSettings:
        - ResourcePath: '/*'
          HttpMethod:   '*'
          ThrottlingBurstLimit: 50
          ThrottlingRateLimit:  25
        - ResourcePath: /v1/auth/phone/request-otp
          HttpMethod:   POST
          ThrottlingBurstLimit: 5
          ThrottlingRateLimit:  2
        - ResourcePath: /v1/billing/razorpay/webhook
          HttpMethod:   POST
          ThrottlingBurstLimit: 20
          ThrottlingRateLimit:  10

  # ── Lambda Function ─────────────────────────────────────
  TranslatorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "ai-translator-${Stage}"
      CodeUri:      ./
      Policies:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - !Ref DynamoDBPolicy
        - !Ref CognitoAdminPolicy
        - !Ref CostExplorerPolicy
        - !Ref S3AudioPolicy
        - !Ref InfraMetricsPolicy
      Environment:
        Variables:
          USER_POOL_ID:        !Ref UserPoolId
          OPENAI_API_KEY:      !Ref OpenAIApiKey
          ELEVENLABS_API_KEY:  !Ref ElevenLabsApiKey
          AZURE_SPEECH_KEY:    !Ref AzureSpeechKey
          AZURE_SPEECH_REGION: !Ref AzureSpeechRegion
          AUDIO_BUCKET:        !Ref AudioBucket
          API_GATEWAY_NAME:    !Sub "ai-translator-api-${Stage}"
          RAZORPAY_KEY_ID:         !Ref RazorpayKeyId
          RAZORPAY_KEY_SECRET:     !Ref RazorpayKeySecret
          RAZORPAY_WEBHOOK_SECRET: !Ref RazorpayWebhookSecret
          RAZORPAY_PLAN_ID_PLUS:   !Ref RazorpayPlanIdPlus
          RAZORPAY_PLAN_ID_LIVE:   !Ref RazorpayPlanIdLive
          USAGE_TABLE:             !Ref UsageTable
      Events:
        # Catch-all proxy — routes every path+method to the single handler
        ProxyRoot:
          Type:       Api
          Properties:
            RestApiId: !Ref TranslatorApi
            Path:      /v1/{proxy+}
            Method:    ANY
        # CORS preflight
        OptionsRoot:
          Type:       Api
          Properties:
            RestApiId: !Ref TranslatorApi
            Path:      /v1/{proxy+}
            Method:    OPTIONS
            Auth:
              Authorizer: NONE
        # Unauthenticated phone-OTP pre-provisioning route — API Gateway resolves
        # this exact literal path ahead of the {proxy+} catch-all above, so it
        # needs its own explicit Auth override (no token exists yet at this point).
        PhoneOtpRequest:
          Type:       Api
          Properties:
            RestApiId: !Ref TranslatorApi
            Path:      /v1/auth/phone/request-otp
            Method:    POST
            Auth:
              Authorizer: NONE
        PhoneOtpRequestOptions:
          Type:       Api
          Properties:
            RestApiId: !Ref TranslatorApi
            Path:      /v1/auth/phone/request-otp
            Method:    OPTIONS
            Auth:
              Authorizer: NONE
        # Unauthenticated Razorpay webhook — Razorpay's servers call this
        # directly (no Cognito token exists for a server-to-server webhook),
        # same explicit-override pattern as the phone-OTP route above. The
        # handler verifies X-Razorpay-Signature itself (see billing.mjs).
        RazorpayWebhook:
          Type:       Api
          Properties:
            RestApiId: !Ref TranslatorApi
            Path:      /v1/billing/razorpay/webhook
            Method:    POST
            Auth:
              Authorizer: NONE
        RazorpayWebhookOptions:
          Type:       Api
          Properties:
            RestApiId: !Ref TranslatorApi
            Path:      /v1/billing/razorpay/webhook
            Method:    OPTIONS
            Auth:
              Authorizer: NONE

  # ── Cognito Custom Auth (phone + OTP) Lambda triggers ──
  # These are invoked directly by Cognito, not via API Gateway, so each
  # needs its own function + explicit Handler override (Globals.Function.Handler
  # points at the translation router above).
  #
  # NOT wired to the user pool automatically — the pool (UserPoolId parameter)
  # isn't a CloudFormation resource in this template (it was created out-of-band),
  # so `aws cognito-idp update-user-pool --lambda-config ...` and
  # `aws lambda add-permission` must be run manually after deploy. See DOCUMENTATION.md.
  DefineAuthChallengeFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "ai-translator-define-auth-${Stage}"
      CodeUri:      ./
      Handler:      src/handlers/defineAuthChallenge.handler
      Policies:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  CreateAuthChallengeFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "ai-translator-create-auth-${Stage}"
      CodeUri:      ./
      Handler:      src/handlers/createAuthChallenge.handler
      Policies:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - !Ref SnsPublishPolicy
      Environment:
        Variables:
          SNS_DLT_ENTITY_ID:   !Ref SnsDltEntityId
          SNS_DLT_TEMPLATE_ID: !Ref SnsDltTemplateId
          SNS_SENDER_ID:       !Ref SnsSenderId

  VerifyAuthChallengeResponseFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "ai-translator-verify-auth-${Stage}"
      CodeUri:      ./
      Handler:      src/handlers/verifyAuthChallengeResponse.handler
      Policies:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  # ── Scheduled data-retention sweep ──────────────────────
  # Account-agnostic (Scan-based, not per-user Query) so it can run on a
  # schedule with no authenticated caller — see retentionSweep.mjs's header
  # comment for why this has to be separate from the per-user
  # DELETE /v1/translations/old route. Shares AudioRetentionDays with the
  # S3 lifecycle rule below so there's one source of truth for how long data
  # is actually kept, matching whatever the privacy policy states.
  RetentionSweepFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "ai-translator-retention-sweep-${Stage}"
      CodeUri:      ./
      Handler:      src/handlers/retentionSweep.handler
      Timeout:      120
      Policies:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - !Ref DynamoDBPolicy
        - !Ref S3AudioPolicy
      Environment:
        Variables:
          RETENTION_DAYS: !Ref AudioRetentionDays
          AUDIO_BUCKET:   !Ref AudioBucket
      Events:
        DailySweep:
          Type: Schedule
          Properties:
            Schedule:    rate(1 day)
            Name:        !Sub "ai-translator-retention-sweep-${Stage}"
            Description: "Daily cleanup of conversation_history rows (+ S3 audio) past AudioRetentionDays"
            Enabled:     true

  # ── DynamoDB Tables ─────────────────────────────────────
  ConversationHistoryTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName:            !Ref TranslationsTable
      BillingMode:          PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: user_id
          AttributeType: S
        - AttributeName: timestamp
          AttributeType: S
        - AttributeName: source_language
          AttributeType: S
        - AttributeName: target_language
          AttributeType: S
      KeySchema:
        - AttributeName: user_id
          KeyType:        HASH
        - AttributeName: timestamp
          KeyType:        RANGE
      # GSI-1: query by language pair for a user
      GlobalSecondaryIndexes:
        - IndexName:            ByLanguagePair
          KeySchema:
            - AttributeName: source_language
              KeyType:        HASH
            - AttributeName: target_language
              KeyType:        RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # ── S3 Bucket — translation audio (source recordings + TTS output) ──
  # Private (all public access blocked); the app reaches objects only via
  # short-lived presigned GET URLs minted by the Lambda (see backend/src/s3.mjs).
  AudioBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "ai-translator-audio-${Stage}-${AWS::AccountId}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls:       true
        BlockPublicPolicy:     true
        IgnorePublicAcls:      true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id:     ExpireAudioAfterRetention
            Status: Enabled
            ExpirationInDays: !Ref AudioRetentionDays
      CorsConfiguration:
        # Read-only — objects are fetched via presigned GET URLs from the Expo
        # web build too, which is subject to browser CORS (native iOS/Android
        # HTTP clients ignore this entirely).
        CorsRules:
          - AllowedMethods: [GET]
            AllowedOrigins: ['*']
            AllowedHeaders: ['*']
            MaxAge: 3000

  UserSettingsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName:   !Ref SettingsTable
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: user_id
          AttributeType: S
      KeySchema:
        - AttributeName: user_id
          KeyType:        HASH

  # ── Disposable per-user/per-day AI-proxy call counters (lib/usageLimits.mjs) ──
  # No PITR — this is a cost-control counter, not durable data; a lost counter
  # on restore would just under-enforce for a day, not lose anything real.
  AiUsageTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName:   !Ref UsageTable
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: user_id
          AttributeType: S
        - AttributeName: day
          AttributeType: S
      KeySchema:
        - AttributeName: user_id
          KeyType:        HASH
        - AttributeName: day
          KeyType:        RANGE
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true

  # ── IAM policy for Lambda → DynamoDB ───────────────────
  DynamoDBPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "ai-translator-dynamo-${Stage}"
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect:   Allow
            Action:
              - dynamodb:GetItem
              - dynamodb:PutItem
              - dynamodb:UpdateItem
              - dynamodb:DeleteItem
              - dynamodb:Query
              - dynamodb:Scan
              - dynamodb:BatchWriteItem
            Resource:
              - !GetAtt ConversationHistoryTable.Arn
              - !Sub "${ConversationHistoryTable.Arn}/index/*"
              - !GetAtt UserSettingsTable.Arn
              - !GetAtt AiUsageTable.Arn

  # ── IAM policy for Lambda → S3 audio bucket ─────────────
  # Scoped to objects only (bucket/*), not the bucket itself — no ListBucket,
  # no bucket-level actions. PutObject/GetObject back the upload + presign
  # flows; DeleteObject backs cleanup when a history item (or all history) is
  # deleted, so audio never outlives the DynamoDB record that references it.
  S3AudioPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "ai-translator-s3-audio-${Stage}"
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect:   Allow
            Action:
              - s3:PutObject
              - s3:GetObject
              - s3:DeleteObject
            Resource:
              - !Sub "${AudioBucket.Arn}/*"

  # ── IAM policy for the dashboard-metrics route → Cost Explorer ──
  # ce:GetCostAndUsage doesn't support resource-level scoping (account-wide API).
  # Note: AWS bills $0.01 per Cost Explorer API request — dashboardMetrics.mjs
  # caches the result in-memory per warm Lambda container to limit repeat calls.
  CostExplorerPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "ai-translator-cost-explorer-${Stage}"
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect:   Allow
            Action:
              - ce:GetCostAndUsage
            Resource: "*"

  # ── IAM policy for the infra-metrics route → CloudWatch ──
  # GetMetricData reads both AWS-native metrics (Lambda/DynamoDB/ApiGateway,
  # namespace-scoped) and the custom per-route counters emitted via EMF
  # (routeMetrics.mjs) — none of these support resource-level ARN scoping.
  # DescribeLogGroups reads storedBytes for the function's own log group.
  InfraMetricsPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "ai-translator-infra-metrics-${Stage}"
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect:   Allow
            Action:
              - cloudwatch:GetMetricData
            Resource: "*"
          - Effect:   Allow
            Action:
              - logs:DescribeLogGroups
            Resource: "*"

  # ── IAM policy for CreateAuthChallenge → SNS (OTP SMS) ──
  SnsPublishPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "ai-translator-sns-${Stage}"
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect:   Allow
            Action:
              - sns:Publish
            # SNS direct-to-phone-number publishing doesn't support resource-level ARN scoping.
            Resource: "*"

  # ── IAM policy for phone-OTP pre-provisioning + admin analytics (TranslatorFunction) ──
  CognitoAdminPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "ai-translator-cognito-admin-${Stage}"
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect:   Allow
            Action:
              - cognito-idp:AdminCreateUser
              - cognito-idp:AdminGetUser
              - cognito-idp:AdminSetUserPassword
              - cognito-idp:AdminDeleteUser
              - cognito-idp:ListUsers
            Resource:
              - !Sub "arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${UserPoolId}"

  # ── Cost monitoring ──────────────────────────────────────
  # Two manual, one-time prerequisites CloudFormation cannot set for you:
  #   1. This stack must deploy to us-east-1 — the AWS/Billing namespace's
  #      EstimatedCharges metric is published ONLY there, regardless of which
  #      region your actual resources run in (already true here — see
  #      backend/samconfig.toml's region).
  #   2. The account's Billing preferences must have "Receive Billing Alerts"
  #      checked (Billing console → Billing preferences) — an account-level
  #      setting with no CloudFormation equivalent. Until it's checked, this
  #      metric simply never populates and the alarm stays permanently in
  #      INSUFFICIENT_DATA, not ALARM — it isn't broken, it has no data yet.
  BillingAlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "ai-translator-billing-alarm-${Stage}"

  BillingAlarmEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasBillingAlarmEmail
    Properties:
      TopicArn: !Ref BillingAlarmTopic
      Protocol: email
      Endpoint: !Ref BillingAlarmEmail

  EstimatedChargesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName:        !Sub "ai-translator-estimated-charges-${Stage}"
      AlarmDescription: !Sub "Estimated AWS charges exceeded $${BillingAlarmThresholdUSD} — see the BillingAlarmThresholdUSD parameter to tune."
      Namespace:         AWS/Billing
      MetricName:        EstimatedCharges
      Dimensions:
        - Name:  Currency
          Value: USD
      Statistic:          Maximum
      Period:             21600 # 6 hours — this metric itself only updates a few times/day
      EvaluationPeriods:  1
      ComparisonOperator: GreaterThanThreshold
      Threshold:          !Ref BillingAlarmThresholdUSD
      TreatMissingData:   notBreaching
      AlarmActions:
        - !Ref BillingAlarmTopic

# ──────────────────────────────────────────────────────────
# Outputs
# ──────────────────────────────────────────────────────────
Outputs:
  ApiBaseUrl:
    Description: "API Gateway base URL — set as EXPO_PUBLIC_API_BASE_URL in .env"
    Value:        !Sub "https://${TranslatorApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}"

  FunctionArn:
    Description: "Lambda function ARN"
    Value:        !GetAtt TranslatorFunction.Arn

  AudioBucketName:
    Description: "S3 bucket storing translation audio (source + TTS)"
    Value:        !Ref AudioBucket

  DefineAuthChallengeFunctionArn:
    Description: "Cognito DefineAuthChallenge trigger ARN — needed for `aws cognito-idp update-user-pool --lambda-config`, see DOCUMENTATION.md"
    Value:        !GetAtt DefineAuthChallengeFunction.Arn

  CreateAuthChallengeFunctionArn:
    Description: "Cognito CreateAuthChallenge trigger ARN — needed for `aws cognito-idp update-user-pool --lambda-config`, see DOCUMENTATION.md"
    Value:        !GetAtt CreateAuthChallengeFunction.Arn

  VerifyAuthChallengeResponseFunctionArn:
    Description: "Cognito VerifyAuthChallengeResponse trigger ARN — needed for `aws cognito-idp update-user-pool --lambda-config`, see DOCUMENTATION.md"
    Value:        !GetAtt VerifyAuthChallengeResponseFunction.Arn
