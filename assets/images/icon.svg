<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#1e40af"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#60a5fa" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background rounded rect -->
  <rect width="1024" height="1024" rx="230" fill="url(#bg)"/>
  <!-- Subtle inner glow -->
  <rect width="1024" height="1024" rx="230" fill="url(#glow)"/>

  <!-- Microphone body -->
  <rect x="442" y="200" width="140" height="260" rx="70" fill="white" opacity="0.97"/>

  <!-- Microphone stand arc -->
  <path d="M340 460 Q340 600 512 600 Q684 600 684 460"
        fill="none" stroke="white" stroke-width="44" stroke-linecap="round" opacity="0.97"/>

  <!-- Microphone stand pole -->
  <line x1="512" y1="600" x2="512" y2="680"
        stroke="white" stroke-width="44" stroke-linecap="round" opacity="0.97"/>

  <!-- Microphone stand base -->
  <line x1="390" y1="680" x2="634" y2="680"
        stroke="white" stroke-width="44" stroke-linecap="round" opacity="0.97"/>

  <!-- Speech / sound-wave rings (right side — "translation output") -->
  <!-- inner wave -->
  <path d="M720 400 Q790 480 720 560"
        fill="none" stroke="white" stroke-width="34" stroke-linecap="round" opacity="0.75"/>
  <!-- outer wave -->
  <path d="M776 350 Q880 480 776 610"
        fill="none" stroke="white" stroke-width="34" stroke-linecap="round" opacity="0.45"/>

  <!-- Subtle "AI" text at bottom -->
  <text x="512" y="830" font-family="Arial, Helvetica, sans-serif"
        font-size="110" font-weight="900" fill="white" opacity="0.9"
        text-anchor="middle" letter-spacing="8">AI</text>
</svg>
