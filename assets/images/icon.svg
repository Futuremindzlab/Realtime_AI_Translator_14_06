<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- OneLingo mark: two opposing bars with arrowheads — the same
       translate/swap glyph already used for the language-pair swap
       control in the app, scaled up as the brand mark. Colors match
       lib/canvasTheme.ts's Person A / Person B bridge gradient. -->
  <defs>
    <linearGradient id="bridge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B3FE8"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <radialGradient id="glow" cx="28%" cy="20%" r="80%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.26"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Full-bleed square — iOS/Android/web each apply their own corner mask,
       so this must NOT pre-round its own corners. -->
  <rect width="1024" height="1024" fill="url(#bridge)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>

  <g>
    <rect x="300" y="404" width="430" height="72" rx="36" fill="#ffffff"/>
    <polygon points="700,364 700,516 826,440" fill="#ffffff"/>
  </g>
  <g>
    <rect x="294" y="548" width="430" height="72" rx="36" fill="#ffffff"/>
    <polygon points="324,508 324,660 198,584" fill="#ffffff"/>
  </g>
</svg>
